<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ocean Blue/Cyan Gradient exactly from your main logo -->
    <linearGradient id="ocean-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
  </defs>

  <!-- Background Square using the Ocean Gradient -->
  <rect width="512" height="512" rx="110" fill="url(#ocean-grad)"/>
  
  <!-- Massive, bold KM in Pure White to match the logo text exactly -->
  <text x="50%" y="54%" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="280" 
        fill="#ffffff">
    KM
  </text>
</svg>
