{{ define "main" }}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 2rem;">
  <h1 style="font-size: 6rem; font-weight: 800; margin: 0; line-height: 1; opacity: 0.15;">404</h1>
  <h2 style="font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem;">Page Not Found</h2>
  <p style="max-width: 420px; opacity: 0.7; margin-bottom: 2rem;">
    The page you're looking for doesn't exist or has been moved.
  </p>
  <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
    <a href="/" style="padding: 0.6rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; background: rgb(var(--color-primary-500)); color: rgb(var(--color-neutral-900));">
      ← Home
    </a>
    <a href="/blog/" style="padding: 0.6rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; border: 1px solid rgb(var(--color-neutral-500)); color: rgb(var(--color-neutral));">
      Blog
    </a>
    <a href="/about/" style="padding: 0.6rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; border: 1px solid rgb(var(--color-neutral-500)); color: rgb(var(--color-neutral));">
      About
    </a>
  </div>
</div>
{{ end }}
