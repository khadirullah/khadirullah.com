<!-- DiagView & Panzoom Integration -->
<script>
  // 1. Synchronously hide diagrams from the built-in theme mermaid processor
  // The theme's appearance.js runs on DOMContentLoaded and looks for .mermaid
  // DiagView starts itself with default options unless this is set; it is
  // started below, after mermaid has drawn the diagrams.
  document.documentElement.setAttribute('data-diagview-no-auto-init', '');
  document.querySelectorAll('pre.mermaid').forEach(function (el) {
    el.classList.remove('mermaid');
    el.classList.add('custom-mermaid');
  });
</script>

<script type="module">
  const mermaidBlocks = document.querySelectorAll('.custom-mermaid');
  if (mermaidBlocks.length > 0) {
    // Inject DiagView CSS fix
    const style = document.createElement('style');
    style.textContent = '.diagview-menu, .diagview-menu *, [class*="dv-"], [id^="dv-"] { text-decoration: none !important; text-decoration-line: none !important; }';
    document.head.appendChild(style);

    // Load Panzoom
    const panzoomScript = document.createElement('script');
    panzoomScript.src = 'https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js';
    document.head.appendChild(panzoomScript);

    // Load DiagView after Panzoom
    panzoomScript.onload = () => {
      const diagviewScript = document.createElement('script');
      diagviewScript.src = 'https://cdn.jsdelivr.net/npm/diagview@1/dist/diagview.umd.min.js';
      document.head.appendChild(diagviewScript);

      diagviewScript.onload = async () => {
        try {
          // Wait for the theme's bundled mermaid to be ready
          const waitForMermaid = () => new Promise(resolve => {
            if (window.mermaid) return resolve(window.mermaid);
            const interval = setInterval(() => {
              if (window.mermaid) {
                clearInterval(interval);
                resolve(window.mermaid);
              }
            }, 50);
          });

          const mermaid = await waitForMermaid();

          // Mermaid replaces each block's source with the drawn SVG, so keep
          // the sources to draw the diagrams again when the theme switches.
          // Mermaid reads the block's HTML, so a <br/> in a label is an
          // element here and textContent would drop it.
          const blocks = [...mermaidBlocks];
          const sources = blocks.map(el => el.innerHTML);
          const options = {
            layout: 'off',
            offHint: 'below',
            accentColor: '#2f73cd', // the theme's primary-600
            showKeyboardHelp: true,
            diagramSelector: '.custom-mermaid',
            showMinimap: true,
            // Stamps exported and downloaded images only, never the page
            watermark: {
              enabled: true,
              text: 'khadirullah.com',
              style: 'corner',
              position: 'bottom-right',
              placement: 'margin',
              opacity: 0.4,
            },
          };
          let drawnDark;

          const drawDiagrams = async () => {
            const isDark = document.documentElement.classList.contains("dark");
            drawnDark = isDark;
            blocks.forEach((el, i) => {
              el.removeAttribute('data-processed');
              el.innerHTML = sources[i];
            });
            mermaid.initialize({
              startOnLoad: false,
              theme: isDark ? 'dark' : 'base',
              themeVariables: {
                fontFamily: "ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,segoe ui,Roboto,helvetica neue,Arial,noto sans,sans-serif",
                fontSize: "16px",
                // Dark theme edge labels are #cccccc on #585858 (4.43:1). #525252 passes 4.5:1.
                ...(isDark && { edgeLabelBackground: '#525252' })
              }
            });
            await mermaid.run({ nodes: blocks });
          };

          await drawDiagrams();
          let queue = Promise.resolve(DiagView.init(options));

          // Mermaid writes the theme colours into each SVG, so a switch
          // between light and dark draws the diagrams again with the new theme.
          new MutationObserver(() => {
            queue = queue.then(async () => {
              if (document.documentElement.classList.contains("dark") === drawnDark) return;
              await DiagView.destroy();
              await drawDiagrams();
              await DiagView.init(options);
            }).catch(err => console.error("Failed to redraw the diagrams:", err));
          }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        } catch (err) {
          console.error("Failed to initialize Mermaid or DiagView:", err);
        }
      };
    };
  }
</script>
