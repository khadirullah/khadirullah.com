<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(39, 39, 42, 0.8)" />
      <stop offset="100%" stop-color="rgba(24, 24, 27, 0.9)" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="success-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Abstract Background Elements -->
  <circle cx="200" cy="100" r="300" fill="#3b82f6" opacity="0.05" filter="url(#glow-heavy)" />
  <circle cx="1000" cy="500" r="300" fill="#8b5cf6" opacity="0.05" filter="url(#glow-heavy)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0,105 H1200 M0,210 H1200 M0,315 H1200 M0,420 H1200 M0,525 H1200" />
    <path d="M200,0 V630 M400,0 V630 M600,0 V630 M800,0 V630 M1000,0 V630" />
  </g>

  <!-- All Content Shifted Down for Hero Safe Area -->
  <g transform="translate(0, 50)">
    <!-- Title Top Center -->
    <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Custom Domain Email Setup</text>
    <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">SPF • DKIM • DMARC</text>

    <!-- Connection paths -->
    <!-- Left to Center -->
    <path d="M 250 350 C 350 350, 350 350, 420 350" fill="none" stroke="url(#primary-glow)" stroke-width="4" stroke-dasharray="10 10" filter="url(#glow-light)" />
    <!-- Center to Right -->
    <path d="M 780 350 C 850 350, 850 350, 950 350" fill="none" stroke="url(#success-glow)" stroke-width="4" stroke-dasharray="10 10" filter="url(#glow-light)" />

    <!-- LEFT: Sender / DNS Node -->
    <g transform="translate(100, 270)" filter="url(#shadow)">
      <!-- Base Node -->
      <rect width="160" height="160" rx="24" fill="url(#card-grad)" stroke="#3f3f46" stroke-width="2" />
      <circle cx="80" cy="65" r="35" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="2" filter="url(#glow-light)" />
      <!-- Cloudflare/DNS icon abstract -->
      <path d="M 65 70 Q 65 55 80 55 Q 85 40 100 40 Q 115 40 115 55 Q 125 55 125 70 Q 125 85 105 85 L 70 85 Q 65 85 65 70 Z" fill="#3b82f6" transform="translate(-15,-15) scale(0.9)" />
      <text x="80" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f4f4f5" text-anchor="middle">DNS / Sender</text>
      <text x="80" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" text-anchor="middle">Cloudflare</text>
    </g>

    <!-- CENTER: Authentication Dashboard (SPF/DKIM/DMARC) -->
    <g transform="translate(420, 200)" filter="url(#shadow)">
      <rect width="360" height="300" rx="24" fill="url(#card-grad)" stroke="#52525b" stroke-width="2" />
      <!-- Window Controls -->
      <circle cx="30" cy="30" r="6" fill="#ef4444" />
      <circle cx="50" cy="30" r="6" fill="#f59e0b" />
      <circle cx="70" cy="30" r="6" fill="#10b981" />
      <text x="180" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" text-anchor="middle">Auth Gateway</text>
      <path d="M 0 50 H 360" stroke="#3f3f46" stroke-width="2" />

      <!-- SPF ROW -->
      <g transform="translate(30, 80)">
        <rect width="300" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="#3f3f46" stroke-width="1" />
        <!-- Shield -->
        <path d="M 25 15 L 35 10 L 45 15 L 45 25 C 45 35 35 42 35 42 C 35 42 25 35 25 25 Z" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glow-light)" />
        <text x="65" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">SPF</text>
        <!-- Status Badge -->
        <rect x="230" y="13" width="55" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1" filter="url(#glow-light)"/>
        <circle cx="242" cy="25" r="4" fill="#10b981" />
        <text x="252" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#10b981">PASS</text>
      </g>

      <!-- DKIM ROW -->
      <g transform="translate(30, 150)">
        <rect width="300" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="#3f3f46" stroke-width="1" />
        <!-- Key Icon -->
        <circle cx="32" cy="22" r="6" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-light)" />
        <path d="M 37 27 L 46 36 L 49 33 M 43 33 L 46 30" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-light)" />
        <text x="65" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">DKIM</text>
        <!-- Status Badge -->
        <rect x="230" y="13" width="55" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1" filter="url(#glow-light)"/>
        <circle cx="242" cy="25" r="4" fill="#10b981" />
        <text x="252" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#10b981">PASS</text>
      </g>

      <!-- DMARC ROW -->
      <g transform="translate(30, 220)">
        <rect width="300" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="#3f3f46" stroke-width="1" />
        <!-- Checklist Icon -->
        <rect x="25" y="12" width="20" height="26" rx="3" fill="none" stroke="#ec4899" stroke-width="2" filter="url(#glow-light)" />
        <path d="M 32 20 L 40 20 M 32 26 L 40 26 M 32 32 L 36 32" stroke="#ec4899" stroke-width="2" stroke-linecap="round" filter="url(#glow-light)" />
        <text x="65" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">DMARC</text>
        <!-- Status Badge -->
        <rect x="230" y="13" width="55" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1" filter="url(#glow-light)"/>
        <circle cx="242" cy="25" r="4" fill="#10b981" />
        <text x="252" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#10b981">PASS</text>
      </g>
    </g>

    <!-- RIGHT: Receiver / Inbox Node -->
    <g transform="translate(950, 270)" filter="url(#shadow)">
      <!-- Base Node -->
      <rect width="160" height="160" rx="24" fill="url(#card-grad)" stroke="#10b981" stroke-width="2" filter="url(#glow-light)" />
      <!-- Mail / Inbox Icon -->
      <g transform="translate(80, 65)">
        <rect x="-25" y="-18" width="50" height="36" rx="4" fill="none" stroke="#10b981" stroke-width="3" />
        <path d="M -25 -18 L 0 5 L 25 -18" fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round" />
        <!-- Green check overlapping -->
        <circle cx="25" cy="18" r="14" fill="#10b981" />
        <path d="M 19 18 L 23 22 L 31 14" fill="none" stroke="#09090b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="80" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f4f4f5" text-anchor="middle">Inbox</text>
      <text x="80" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" text-anchor="middle">Verified Delivery</text>
    </g>

    <!-- Connection Nodes / Dots -->
    <circle cx="260" cy="350" r="5" fill="#3b82f6" filter="url(#glow-light)" />
    <circle cx="420" cy="350" r="5" fill="#3b82f6" filter="url(#glow-light)" />
    <circle cx="780" cy="350" r="5" fill="#10b981" filter="url(#glow-light)" />
    <circle cx="950" cy="350" r="5" fill="#10b981" filter="url(#glow-light)" />
  </g>

</svg>
