<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="50%" stop-color="#0E213D" />
      <stop offset="100%" stop-color="#060C16" />
    </linearGradient>
    
    <!-- Glowing Orbs Gradients (Teal for "Waters" and Coral for brand) -->
    <radialGradient id="glowCoral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Effect -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Glowing Orbs -->
  <circle cx="200" cy="500" r="450" fill="url(#glowTeal)" />
  <circle cx="1000" cy="150" r="400" fill="url(#glowCoral)" />
  <circle cx="600" cy="315" r="300" fill="url(#glowTeal)" opacity="0.5" />

  <!-- Abstract YAML to SQL representation -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" fill="none">
    <path d="M100 315 L1100 315" stroke-dasharray="10 10" />
    <path d="M-50 100 Q 300 200 400 450 T 1300 500" />
    <path d="M200 -50 Q 300 400 800 450 T 1000 700" />
    
    <circle cx="400" cy="450" r="6" fill="#00F0FF" opacity="0.8" />
    <circle cx="800" cy="450" r="6" fill="#FF6B6B" opacity="0.8" />
  </g>

  <!-- Main Glassmorphism Content Card -->
  <rect x="150" y="100" width="900" height="430" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" filter="url(#glass)" />
  
  <!-- Content inside Card -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Hackathon Badge -->
    <rect x="340" y="160" width="520" height="46" rx="23" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5" />
    <text x="600" y="189" font-size="18" font-weight="600" fill="#80F8FF" text-anchor="middle" letter-spacing="1">
      PIRATES OF THE CORAL-BEAN  •  BY WEMAKEDEVS
    </text>

    <!-- Main Title -->
    <text x="600" y="279" font-size="58" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
      Charting New Waters
    </text>
    <!-- Highlighted Title -->
    <text x="600" y="349" font-size="64" font-weight="900" fill="#00F0FF" text-anchor="middle" letter-spacing="-1">
      Custom Source Specs
    </text>

    <!-- Subtitle -->
    <text x="600" y="419" font-size="24" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.7">
      Turning Internal Private APIs into SQL Tables
    </text>

    <!-- Built By / Powered By -->
    <text x="200" y="485" font-size="18" font-weight="500" fill="#A0ABBA" opacity="0.9">Built by Khadirullah</text>
    <text x="1000" y="485" font-size="18" font-weight="500" fill="#A0ABBA" text-anchor="end" opacity="0.9">Powered by Coral SQL</text>

    <!-- UI Decorative dots -->
    <circle cx="190" cy="135" r="6" fill="#FF5F56" />
    <circle cx="210" cy="135" r="6" fill="#FFBD2E" />
    <circle cx="230" cy="135" r="6" fill="#27C93F" />
  </g>

  <!-- YAML File Icon Left -->
  <g transform="translate(100, 480) scale(0.6)" opacity="0.3">
    <path d="M30 20 L30 100 L70 100 L70 40 L50 20 Z" stroke="#00F0FF" stroke-width="6" fill="none" />
    <line x1="40" y1="50" x2="60" y2="50" stroke="#00F0FF" stroke-width="4" />
    <line x1="40" y1="65" x2="60" y2="65" stroke="#00F0FF" stroke-width="4" />
    <line x1="40" y1="80" x2="50" y2="80" stroke="#00F0FF" stroke-width="4" />
  </g>

  <!-- Database SQL Icon Right -->
  <g transform="translate(1000, 60) scale(0.6)" opacity="0.3">
    <ellipse cx="50" cy="30" rx="40" ry="15" stroke="#FF6B6B" stroke-width="6" fill="none" />
    <ellipse cx="50" cy="60" rx="40" ry="15" stroke="#FF6B6B" stroke-width="6" fill="none" />
    <ellipse cx="50" cy="90" rx="40" ry="15" stroke="#FF6B6B" stroke-width="6" fill="none" />
    <line x1="10" y1="30" x2="10" y2="90" stroke="#FF6B6B" stroke-width="6" />
    <line x1="90" y1="30" x2="90" y2="90" stroke="#FF6B6B" stroke-width="6" />
  </g>
</svg>
