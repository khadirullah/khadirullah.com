<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <g transform="translate(600, 270)">
    <!-- Git Branch icon -->
    <circle cx="-180" cy="0" r="32" fill="#3b82f6" />
    <circle cx="-180" cy="-100" r="24" fill="#3b82f6" />
    <circle cx="-180" cy="100" r="24" fill="#3b82f6" />
    <path d="M-180,32 L-180,76 M-180,-32 L-180,-76" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" />
    <path d="M-156,-10 L-60,-10" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
    <path d="M-156,10 L-60,10" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
    
    <!-- Broken connection line -->
    <g transform="translate(-108, 0)">
      <line x1="-20" y1="-25" x2="20" y2="25" stroke="#f43f5e" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="20" y1="-25" x2="-20" y2="25" stroke="#f43f5e" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    </g>
    
    <!-- Submodule Folder -->
    <path d="M-20,-80 L50,-80 L70,-50 L160,-50 A20,20 0 0,1 180,-30 L180,80 A20,20 0 0,1 160,100 L-20,100 A20,20 0 0,1 -40,80 L-40,-60 A20,20 0 0,1 -20,-80 Z" fill="#3b82f6" opacity="0.3" />
    <path d="M-40,-30 L180,-30 L180,80 A20,20 0 0,1 160,100 L-20,100 A20,20 0 0,1 -40,80 Z" fill="#3b82f6" opacity="0.8" />
    <path d="M-40,-30 L180,-30" stroke="#60a5fa" stroke-width="4" />
    
    <text x="70" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="36" text-anchor="middle">submodule</text>
    <text x="70" y="80" fill="#93c5fd" font-family="system-ui, sans-serif" font-weight="600" font-size="20" text-anchor="middle">.gitmodules</text>
  </g>

  <!-- Title Text -->
  <text x="600" y="500" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="52" text-anchor="middle">Broken Git Submodules</text>
  <text x="600" y="550" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="28" text-anchor="middle">Diagnosing and Fixing Hugo Themes</text>

  <!-- Ambient Glows -->
  <circle cx="150" cy="150" r="200" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="550" r="250" fill="#f43f5e" opacity="0.1" filter="url(#glow)" />
</svg>
