<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>

    <!-- Glow Orbs -->
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#844FBA;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#844FBA;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#326CE5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#326CE5;stop-opacity:0"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="softShadow">
       <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glows behind logos -->
  <circle cx="430" cy="350" r="300" fill="url(#glowPurple)"/>
  <circle cx="770" cy="350" r="300" fill="url(#glowBlue)"/>

  <!-- Top Label -->
  <g transform="translate(600, 90)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#1e1b4b" stroke="#844FBA" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" fill="#d8b4fe" letter-spacing="2">DEVOPS &amp; KUBERNETES</text>
  </g>

  <!-- Title -->
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="56" fill="#f8fafc" letter-spacing="0.5">Local Kubernetes Cluster</text>
  <text x="600" y="220" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="28" fill="#94a3b8">Automated Multi-Node Lab with Terraform &amp; QEMU/KVM</text>

  <!-- Logos Container -->
  
  <!-- Terraform Logo -->
  <g transform="translate(430, 380)" filter="url(#dropShadow)">
    <rect x="-80" y="-80" width="160" height="160" rx="40" fill="#0f172a" stroke="#844FBA" stroke-width="2"/>
    <g transform="translate(0, -10)">
       <g transform="scale(3.5) translate(-12, -12)">
         <path d="M1.44 0v7.575l6.561 3.79V3.787zm21.12 4.227l-6.561 3.791v7.574l6.56-3.787zM8.72 4.23v7.575l6.561 3.787V8.018zm0 8.405v7.575L15.28 24v-7.578z" fill="#844FBA"/>
       </g>
    </g>
    <text y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#d8b4fe">Terraform</text>
  </g>

  <!-- Plus Sign / Connector -->
  <g transform="translate(600, 380)" filter="url(#softShadow)">
     <rect x="-20" y="-4" width="40" height="8" rx="4" fill="#475569"/>
     <rect x="-4" y="-20" width="8" height="40" rx="4" fill="#475569"/>
  </g>

  <!-- Kubernetes Logo -->
  <g transform="translate(770, 380)" filter="url(#dropShadow)">
    <rect x="-80" y="-80" width="160" height="160" rx="40" fill="#0f172a" stroke="#326CE5" stroke-width="2"/>
    <g transform="translate(0, -10)">
       <g transform="scale(3.5) translate(-12, -12)">
         <path d="M10.204 14.35l.007.01-.999 2.413a5.171 5.171 0 0 1-2.075-2.597l2.578-.437.004.005a.44.44 0 0 1 .484.606zm-.833-2.129a.44.44 0 0 0 .173-.756l.002-.011L7.585 9.7a5.143 5.143 0 0 0-.73 3.255l2.514-.725.002-.009zm1.145-1.98a.44.44 0 0 0 .699-.337l.01-.005.15-2.62a5.144 5.144 0 0 0-3.01 1.442l2.147 1.523.004-.002zm.76 2.75l.723.349.722-.347.18-.78-.5-.623h-.804l-.5.623.179.779zm1.5-3.095a.44.44 0 0 0 .7.336l.008.003 2.134-1.513a5.188 5.188 0 0 0-2.992-1.442l.148 2.615.002.001zm10.876 5.97l-5.773 7.181a1.6 1.6 0 0 1-1.248.594l-9.261.003a1.6 1.6 0 0 1-1.247-.596l-5.776-7.18a1.583 1.583 0 0 1-.307-1.34L2.1 5.573c.108-.47.425-.864.863-1.073L11.305.513a1.606 1.606 0 0 1 1.385 0l8.345 3.985c.438.209.755.604.863 1.073l2.062 8.955c.108.47-.005.963-.308 1.34zm-3.289-2.057c-.042-.01-.103-.026-.145-.034-.174-.033-.315-.025-.479-.038-.35-.037-.638-.067-.895-.148-.105-.04-.18-.165-.216-.216l-.201-.059a6.45 6.45 0 0 0-.105-2.332 6.465 6.465 0 0 0-.936-2.163c.052-.047.15-.133.177-.159.008-.09.001-.183.094-.282.197-.185.444-.338.743-.522.142-.084.273-.137.415-.242.032-.024.076-.062.11-.089.24-.191.295-.52.123-.736-.172-.216-.506-.236-.745-.045-.034.027-.08.062-.111.088-.134.116-.217.23-.33.35-.246.25-.45.458-.673.609-.097.056-.239.037-.303.033l-.19.135a6.545 6.545 0 0 0-4.146-2.003l-.012-.223c-.065-.062-.143-.115-.163-.25-.022-.268.015-.557.057-.905.023-.163.061-.298.068-.475.001-.04-.001-.099-.001-.142 0-.306-.224-.555-.5-.555-.275 0-.499.249-.499.555l.001.014c0 .041-.002.092 0 .128.006.177.044.312.067.475.042.348.078.637.056.906a.545.545 0 0 1-.162.258l-.012.211a6.424 6.424 0 0 0-4.166 2.003 8.373 8.373 0 0 1-.18-.128c-.09.012-.18.04-.297-.029-.223-.15-.427-.358-.673-.608-.113-.12-.195-.234-.329-.349-.03-.026-.077-.062-.111-.088a.594.594 0 0 0-.348-.132.481.481 0 0 0-.398.176c-.172.216-.117.546.123.737l.007.005.104.083c.142.105.272.159.414.242.299.185.546.338.743.522.076.082.09.226.1.288l.16.143a6.462 6.462 0 0 0-1.02 4.506l-.208.06c-.055.072-.133.184-.215.217-.257.081-.546.11-.895.147-.164.014-.305.006-.48.039-.037.007-.09.02-.133.03l-.004.002-.007.002c-.295.071-.484.342-.423.608.061.267.349.429.645.365l.007-.001.01-.003.129-.029c.17-.046.294-.113.448-.172.33-.118.604-.217.87-.256.112-.009.23.069.288.101l.217-.037a6.5 6.5 0 0 0 2.88 3.596l-.09.218c.033.084.069.199.044.282-.097.252-.263.517-.452.813-.091.136-.185.242-.268.399-.02.037-.045.095-.064.134-.128.275-.034.591.213.71.248.12.556-.007.69-.282v-.002c.02-.039.046-.09.062-.127.07-.162.094-.301.144-.458.132-.332.205-.68.387-.897.05-.06.13-.082.215-.105l.113-.205a6.453 6.453 0 0 0 4.609.012l.106.192c.086.028.18.042.256.155.136.232.229.507.342.84.05.156.074.295.145.457.016.037.043.09.062.129.133.276.442.402.69.282.247-.118.341-.435.213-.71-.02-.039-.045-.096-.065-.134-.083-.156-.177-.261-.268-.398-.19-.296-.346-.541-.443-.793-.04-.13.007-.21.038-.294-.018-.022-.059-.144-.083-.202a6.499 6.499 0 0 0 2.88-3.622c.064.01.176.03.213.038.075-.05.144-.114.28-.104.266.039.54.138.87.256.154.06.277.128.448.173.036.01.088.019.13.028l.009.003.007.001c.297.064.584-.098.645-.365.06-.266-.128-.537-.423-.608zM16.4 9.701l-1.95 1.746v.005a.44.44 0 0 0 .173.757l.003.01 2.526.728a5.199 5.199 0 0 0-.108-1.674A5.208 5.208 0 0 0 16.4 9.7zm-4.013 5.325a.437.437 0 0 0-.404-.232.44.44 0 0 0-.372.233h-.002l-1.268 2.292a5.164 5.164 0 0 0 3.326.003l-1.27-2.296h-.01zm1.888-1.293a.44.44 0 0 0-.27.036.44.44 0 0 0-.214.572l-.003.004 1.01 2.438a5.15 5.15 0 0 0 2.081-2.615l-2.6-.44-.004.005z" fill="#326CE5"/>
       </g>
    </g>
    <text y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#93c5fd">Kubernetes</text>
  </g>

  <!-- ==================== BOTTOM TECH BADGES ==================== -->
  <g transform="translate(600, 520)">
    <!-- Connecting Line behind Badges -->
    <line x1="-480" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="1"/>

    <g transform="translate(-450, -16)">
      <!-- Badge 1: K8s -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="65" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#93c5fd" font-weight="600">Kubernetes v1.36</text>
      </g>

      <!-- Badge 2: Terraform -->
      <g transform="translate(145, 0)">
        <rect width="130" height="32" rx="16" fill="#0f172a" stroke="#7b42bc" stroke-width="1.2"/>
        <text x="65" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c084fc" font-weight="600">Libvirt v0.9.8</text>
      </g>

      <!-- Badge 3: Calico -->
      <g transform="translate(290, 0)">
        <rect width="145" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
        <text x="72.5" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6ee7b7" font-weight="600">Calico CNI v3.32</text>
      </g>

      <!-- Badge 4: OS -->
      <g transform="translate(450, 0)">
        <rect width="170" height="32" rx="16" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
        <text x="85" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">Fedora 44 / Ubuntu 24.04</text>
      </g>

      <!-- Badge 5: Hypervisor -->
      <g transform="translate(635, 0)">
        <rect width="125" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="62.5" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#fcd34d" font-weight="600">QEMU / KVM</text>
      </g>

      <!-- Badge 6: Automation -->
      <g transform="translate(775, 0)">
        <rect width="125" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
        <text x="62.5" y="20" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#a7f3d0" font-weight="700">100% Automated</text>
      </g>
    </g>
  </g>

</svg>
