<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#0f172a" stroke-width="0.8"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="ig" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="250" cy="100" rx="300" ry="200" fill="#f59e0b" opacity="0.06" filter="url(#glow)"/>
  <ellipse cx="900" cy="500" rx="350" ry="250" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>

  <!-- Left: Text (Shifted right to x=150, font size optimized to 46px to allow safe-margin) -->
  <text x="150" y="190" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" fill="#64748b" font-weight="600" letter-spacing="4">DESIGNOPS DEEP DIVE</text>
  <text x="150" y="260" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="46" fill="url(#tg)" font-weight="800">SVG Rasterization</text>
  <text x="150" y="325" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="46" fill="#ffffff" font-weight="800">Engine</text>
  <text x="150" y="390" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="46" fill="#ffffff" font-weight="800">Showdown</text>
  <rect x="150" y="405" width="160" height="3" rx="1.5" fill="url(#tg)"/>

  <!-- Tags (Shifted to align with new text start) -->
  <g transform="translate(150, 435)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#252b3d" stroke="#334155" stroke-width="1.2"/>
    <text x="60" y="22" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">Inkscape</text>
    <rect x="135" y="0" width="130" height="34" rx="17" fill="#252b3d" stroke="#334155" stroke-width="1.2"/>
    <text x="200" y="22" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">ImageMagick</text>
    <rect x="280" y="0" width="110" height="34" rx="17" fill="#252b3d" stroke="#334155" stroke-width="1.2"/>
    <text x="335" y="22" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">Chrome</text>
  </g>

  <!-- Right: Comparison Cards (Card width optimized to 400px, translated to x=640 to keep inside safe area) -->
  <!-- Left padding: 150px, Right padding: 160px. Zero crop risk. -->
  <g transform="translate(640, 100)">

    <!-- Card 1: Inkscape — Amber/Warning -->
    <g filter="url(#ig)">
      <rect x="0" y="0" width="400" height="120" rx="16" fill="#252b3d" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Terminal dots -->
      <circle cx="20" cy="18" r="5" fill="#ef4444"/>
      <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
      <circle cx="52" cy="18" r="5" fill="#22c55e"/>
      <text x="75" y="22" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#64748b" font-weight="500">inkscape</text>

      <text x="25" y="55" font-family="'Courier New',monospace" font-size="13" fill="#7dd3fc">$ inkscape file.svg -o file.png</text>
      <text x="25" y="80" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#f59e0b" font-weight="600">⚠ rgba() ignored • feDropShadow fails</text>
      <rect x="290" y="90" width="85" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
      <text x="332" y="105" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#f59e0b" font-weight="700" text-anchor="middle">PARTIAL</text>
    </g>

    <!-- Card 2: ImageMagick — Red/Fail -->
    <g transform="translate(0, 145)" filter="url(#ig)">
      <rect x="0" y="0" width="400" height="120" rx="16" fill="#252b3d" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="5" fill="#ef4444"/>
      <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
      <circle cx="52" cy="18" r="5" fill="#22c55e"/>
      <text x="75" y="22" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#64748b" font-weight="500">magick (librsvg)</text>

      <text x="25" y="55" font-family="'Courier New',monospace" font-size="13" fill="#7dd3fc">$ magick file.svg file.png</text>
      <text x="25" y="80" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#ef4444" font-weight="600">✗ Filters dropped • Glows missing</text>
      <rect x="290" y="90" width="85" height="22" rx="11" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
      <text x="332" y="105" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#ef4444" font-weight="700" text-anchor="middle">RISKY</text>
    </g>

    <!-- Card 3: Chrome — Green/Perfect -->
    <g transform="translate(0, 290)" filter="url(#ig)">
      <rect x="0" y="0" width="400" height="120" rx="16" fill="#252b3d" stroke="#22c55e" stroke-width="2"/>
      <circle cx="20" cy="18" r="5" fill="#ef4444"/>
      <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
      <circle cx="52" cy="18" r="5" fill="#22c55e"/>
      <text x="75" y="22" font-family="'Inter',system-ui,sans-serif" font-size="12" fill="#64748b" font-weight="500">google-chrome --headless</text>

      <text x="25" y="55" font-family="'Courier New',monospace" font-size="13" fill="#7dd3fc">$ chrome --headless --screenshot</text>
      <text x="25" y="80" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#4ade80" font-weight="600">✓ Pixel-perfect • All CSS supported</text>
      <rect x="290" y="90" width="85" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
      <text x="332" y="105" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#22c55e" font-weight="700" text-anchor="middle">PERFECT</text>
      <!-- Winner glow -->
      <circle cx="390" cy="60" r="5" fill="#22c55e">
        <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Crown on Chrome card -->
    <text x="370" y="298" font-family="system-ui,sans-serif" font-size="28">👑</text>
  </g>
</svg>
