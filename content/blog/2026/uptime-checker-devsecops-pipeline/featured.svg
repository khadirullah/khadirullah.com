<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50,0 L0,0 0,50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- ambient glows -->
  <ellipse cx="300" cy="200" rx="250" ry="180" fill="#22d3ee" opacity="0.06" filter="url(#ambient)"/>
  <ellipse cx="900" cy="450" rx="250" ry="180" fill="#c084fc" opacity="0.05" filter="url(#ambient)"/>

  <!-- large centered typography -->
  <g font-family="'Inter',system-ui,sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="16" font-weight="600" fill="#64748b" letter-spacing="4">DEVSECOPS PROJECT</text>

    <text x="600" y="230" font-size="80" font-weight="900" fill="url(#title-grad)" letter-spacing="-2">uptime</text>
    <text x="600" y="310" font-size="80" font-weight="900" fill="#f8fafc" letter-spacing="-2">checker</text>

    <text x="600" y="370" font-size="22" fill="#94a3b8">A real application behind the pipeline</text>

    <!-- feature line -->
    <g transform="translate(600,420)">
      <line x1="-400" y1="0" x2="400" y2="0" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- feature items -->
    <g transform="translate(600,470)" font-size="16">
      <text x="-400" y="0" fill="#22d3ee" font-weight="600">Six Services</text>
      <text x="-400" y="22" fill="#64748b" font-size="15">Go · FastAPI · nginx</text>

      <text x="-160" y="0" fill="#22d3ee" font-weight="600">One Pipeline</text>
      <text x="-160" y="22" fill="#64748b" font-size="15">test · build · scan · PR</text>

      <text x="80" y="0" fill="#22d3ee" font-weight="600">GitOps Deploy</text>
      <text x="80" y="22" fill="#64748b" font-size="15">ArgoCD · Kustomize</text>

      <text x="320" y="0" fill="#22d3ee" font-weight="600">Hardened</text>
      <text x="320" y="22" fill="#64748b" font-size="15">secrets · policies · HPA</text>
    </g>

    <!-- bottom stack -->
    <text x="600" y="540" font-family="'SF Mono',monospace" font-size="15" fill="#475569">Postgres 18  ·  Redis 8  ·  Kubernetes  ·  GitHub Actions  ·  Trivy</text>
  </g>

  <!-- bottom accent line -->
  <rect x="380" y="562" width="440" height="3" rx="1.5" fill="url(#title-grad)"/>
</svg>
