<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strikethrough pattern for deleted blobs -->
    <pattern id="strikePattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="1.5" opacity="0.3"/>
    </pattern>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="100" cy="530" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1100" cy="100" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="60" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="30" fill="#f8fafc" letter-spacing="0.5">Rewriting Git History</text>
    <text x="600" y="93" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">How git filter-repo purges files from every commit</text>

    <!-- ==================== BEFORE: Old History ==================== -->
    <g transform="translate(40, 135)">
      <!-- Section Label -->
      <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#ef4444" letter-spacing="1.5">BEFORE</text>
      <line x1="70" y1="-4" x2="520" y2="-4" stroke="#334155" stroke-width="1"/>

      <!-- Commit 1 -->
      <g transform="translate(0, 25)">
        <rect width="160" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <rect width="160" height="3" rx="1.5" fill="url(#accentOrange)" y="0"/>
        <text x="80" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#fbbf24">a1b2c3d</text>
        <text x="80" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">feat: initial setup</text>
        <text x="80" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">📄 config.yml</text>
      </g>

      <!-- Arrow 1→2 -->
      <line x1="165" y1="70" x2="185" y2="70" stroke="#475569" stroke-width="2"/>
      <polygon points="185,66 193,70 185,74" fill="#475569"/>

      <!-- Commit 2 (the one with PNGs) -->
      <g transform="translate(197, 25)">
        <rect width="195" height="90" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
        <rect width="195" height="3" rx="1.5" fill="url(#accentRed)" y="0"/>
        <text x="97" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#f87171">7adc8c2</text>
        <text x="97" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">blog: add guide</text>
        <text x="50" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">📄 index.md</text>
        <text x="150" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#ef4444" font-weight="700">🖼️ 24 PNGs</text>
      </g>

      <!-- Arrow 2→3 -->
      <line x1="397" y1="70" x2="417" y2="70" stroke="#475569" stroke-width="2"/>
      <polygon points="417,66 425,70 417,74" fill="#475569"/>

      <!-- Commit 3 -->
      <g transform="translate(430, 25)">
        <rect width="160" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <rect width="160" height="3" rx="1.5" fill="url(#accentPurple)" y="0"/>
        <text x="80" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c084fc">e5f6g7h</text>
        <text x="80" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">blog: delete PNGs</text>
        <text x="80" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">🗑️ rm ScreenShots/</text>
      </g>

      <!-- Blob storage indicator -->
      <g transform="translate(630, 15)">
        <rect width="390" height="110" rx="12" fill="#1a0f0f" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="195" y="24" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11" fill="#fca5a5">.git/objects/ (blob storage)</text>
        <!-- Blob icons -->
        <g transform="translate(20, 38)">
          <rect width="50" height="24" rx="4" fill="#2d1515" stroke="#ef4444" stroke-width="1"/>
          <text x="25" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f87171">.png</text>
        </g>
        <g transform="translate(80, 38)">
          <rect width="50" height="24" rx="4" fill="#2d1515" stroke="#ef4444" stroke-width="1"/>
          <text x="25" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f87171">.png</text>
        </g>
        <g transform="translate(140, 38)">
          <rect width="50" height="24" rx="4" fill="#2d1515" stroke="#ef4444" stroke-width="1"/>
          <text x="25" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f87171">.png</text>
        </g>
        <g transform="translate(200, 38)">
          <text x="25" y="16" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#ef4444">... ×24</text>
        </g>
        <text x="195" y="88" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f87171" font-weight="600">⚠️ Still here! Deleted from tree, NOT from objects</text>
      </g>
    </g>

    <!-- ==================== FILTER-REPO ARROW ==================== -->
    <g transform="translate(400, 290)">
      <rect x="0" y="0" width="400" height="50" rx="25" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
      <text x="200" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#60a5fa">git filter-repo --invert-paths</text>
      <text x="200" y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Rewrites every commit, purges orphaned blobs</text>
      <!-- Down arrows -->
      <polygon points="185,55 200,70 215,55" fill="#3b82f6" opacity="0.8"/>
    </g>

    <!-- ==================== AFTER: Clean History ==================== -->
    <g transform="translate(40, 385)">
      <!-- Section Label -->
      <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#22c55e" letter-spacing="1.5">AFTER</text>
      <line x1="60" y1="-4" x2="520" y2="-4" stroke="#334155" stroke-width="1"/>

      <!-- Commit 1 (same) -->
      <g transform="translate(0, 25)">
        <rect width="160" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <rect width="160" height="3" rx="1.5" fill="url(#accentOrange)" y="0"/>
        <text x="80" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#fbbf24">a1b2c3d</text>
        <text x="80" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">feat: initial setup</text>
        <text x="80" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">📄 config.yml</text>
      </g>

      <!-- Arrow 1→2 -->
      <line x1="165" y1="70" x2="185" y2="70" stroke="#475569" stroke-width="2"/>
      <polygon points="185,66 193,70 185,74" fill="#475569"/>

      <!-- Commit 2 (rewritten — NO PNGs) -->
      <g transform="translate(197, 25)">
        <rect width="195" height="90" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
        <rect width="195" height="3" rx="1.5" fill="url(#accentGreen)" y="0"/>
        <text x="97" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4ade80">NEW_HASH</text>
        <text x="97" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">blog: add guide</text>
        <text x="97" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#4ade80">📄 index.md only ✅</text>
      </g>

      <!-- Arrow 2→3 -->
      <line x1="397" y1="70" x2="417" y2="70" stroke="#475569" stroke-width="2"/>
      <polygon points="417,66 425,70 417,74" fill="#475569"/>

      <!-- Commit 3 (rewritten) -->
      <g transform="translate(430, 25)">
        <rect width="160" height="90" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1"/>
        <rect width="160" height="3" rx="1.5" fill="url(#accentGreen)" y="0"/>
        <text x="80" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4ade80">NEW_HASH</text>
        <text x="80" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">next commit</text>
        <text x="80" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#4ade80">✅ Clean</text>
      </g>

      <!-- Clean blob storage -->
      <g transform="translate(630, 15)">
        <rect width="390" height="110" rx="12" fill="#0a1a0f" stroke="#166534" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="195" y="24" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11" fill="#4ade80">.git/objects/ (clean)</text>
        <!-- Size comparison -->
        <g transform="translate(40, 40)">
          <rect width="130" height="32" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
          <text x="65" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" fill="#4ade80">73 MB</text>
        </g>
        <text x="205" y="61" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">←</text>
        <g transform="translate(220, 40)">
          <rect width="130" height="32" rx="6" fill="#1a0f0f" stroke="#7f1d1d" stroke-width="1"/>
          <text x="65" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f87171" text-decoration="line-through">76 MB</text>
        </g>
        <text x="195" y="95" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22c55e" font-weight="600">✅ PNGs purged — as if they never existed</text>
      </g>
    </g>
  </g>
</svg>
