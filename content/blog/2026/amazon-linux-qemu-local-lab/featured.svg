<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== LEFT CARD: Amazon Linux ==================== -->
    <g transform="translate(60, 140)">
      <!-- Card background -->
      <rect width="280" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

      <!-- Top accent bar -->
      <rect width="280" height="4" rx="2" fill="url(#accentOrange)" y="0"/>

      <!-- Cloud icon -->
      <g transform="translate(100, 40)">
        <path d="M40 65 C15 65 0 52 0 38 C0 22 15 10 33 10 C35 4 42 0 50 0 C60 0 68 6 70 14 C82 16 90 26 90 38 C90 52 78 65 60 65 Z" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
        <!-- Download arrow inside cloud -->
        <g transform="translate(35, 22)">
          <line x1="10" y1="0" x2="10" y2="22" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
          <polyline points="3,15 10,22 17,15" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Title -->
      <text x="140" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#f8fafc">Amazon Linux</text>
      <text x="140" y="152" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#f59e0b">2023</text>

      <!-- File info -->
      <g transform="translate(30, 180)">
        <rect width="220" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="110" y="23" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">.qcow2 cloud image</text>
      </g>

      <!-- Details -->
      <g transform="translate(30, 235)">
        <circle cx="8" cy="8" r="3" fill="#22c55e"/>
        <text x="20" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">No default password</text>
      </g>
      <g transform="translate(30, 260)">
        <circle cx="8" cy="8" r="3" fill="#22c55e"/>
        <text x="20" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Expects metadata service</text>
      </g>
      <g transform="translate(30, 285)">
        <circle cx="8" cy="8" r="3" fill="#22c55e"/>
        <text x="20" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">~600MB, boots in 5s</text>
      </g>
      <g transform="translate(30, 310)">
        <circle cx="8" cy="8" r="3" fill="#22c55e"/>
        <text x="20" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Headless server</text>
      </g>
    </g>

    <!-- ==================== MIDDLE: seed.iso / Cloud-Init ==================== -->
    <g transform="translate(430, 175)">
      <!-- Card background -->
      <rect width="320" height="280" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>

      <!-- Top accent bar -->
      <rect width="320" height="4" rx="2" fill="url(#accentBlue)" y="0"/>

      <!-- CD icon -->
      <g transform="translate(125, 25)">
        <circle cx="35" cy="35" r="32" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
        <circle cx="35" cy="35" r="18" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
        <circle cx="35" cy="35" r="6" fill="#60a5fa" opacity="0.6"/>
        <!-- Shine -->
        <path d="M15 20 Q25 15 35 20" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
      </g>

      <!-- Title -->
      <text x="160" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="20" fill="#60a5fa">seed.iso</text>
      <text x="160" y="132" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#64748b">volume label: cidata</text>

      <!-- user-data box -->
      <g transform="translate(20, 150)">
        <rect width="130" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="65" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#60a5fa">user-data</text>
        <line x1="10" y1="30" x2="120" y2="30" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="48" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">#cloud-config</text>
        <text x="12" y="62" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">users:</text>
        <text x="12" y="76" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">  - name: ec2-user</text>
        <text x="12" y="90" font-family="'Courier New', monospace" font-size="9.5" fill="#f59e0b">    ssh_authorized_keys:</text>
      </g>

      <!-- meta-data box -->
      <g transform="translate(170, 150)">
        <rect width="130" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="65" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#60a5fa">meta-data</text>
        <line x1="10" y1="30" x2="120" y2="30" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="50" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">local-hostname:</text>
        <text x="16" y="65" font-family="'Courier New', monospace" font-size="9.5" fill="#22c55e">amzn-devops-vm1</text>
        <text x="12" y="85" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">instance-id:</text>
        <text x="16" y="100" font-family="'Courier New', monospace" font-size="9.5" fill="#22c55e">i-devopslab01</text>
      </g>
    </g>

    <!-- ==================== RIGHT CARD: VM / Result ==================== -->
    <g transform="translate(850, 140)">
      <!-- Card background -->
      <rect width="280" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

      <!-- Top accent bar -->
      <rect width="280" height="4" rx="2" fill="url(#accentGreen)" y="0"/>

      <!-- Terminal icon -->
      <g transform="translate(95, 30)">
        <rect width="90" height="60" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
        <!-- Terminal prompt -->
        <text x="10" y="22" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">$</text>
        <rect x="20" y="14" width="40" height="10" rx="2" fill="#22c55e" opacity="0.3"/>
        <text x="10" y="38" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">$</text>
        <rect x="20" y="30" width="55" height="10" rx="2" fill="#22c55e" opacity="0.2"/>
        <!-- Cursor blink -->
        <rect x="20" y="44" width="7" height="10" rx="1" fill="#22c55e" opacity="0.8"/>
      </g>

      <!-- Title -->
      <text x="140" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#f8fafc">QEMU/KVM</text>
      <text x="140" y="142" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="18" fill="#22c55e">Local VM</text>

      <!-- Status items -->
      <g transform="translate(30, 170)">
        <rect width="220" height="32" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
        <text x="15" y="21" font-family="'Courier New', monospace" font-size="12" fill="#4ade80">✓ SSH key injected</text>
      </g>
      <g transform="translate(30, 212)">
        <rect width="220" height="32" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
        <text x="15" y="21" font-family="'Courier New', monospace" font-size="12" fill="#4ade80">✓ Hostname configured</text>
      </g>
      <g transform="translate(30, 254)">
        <rect width="220" height="32" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
        <text x="15" y="21" font-family="'Courier New', monospace" font-size="12" fill="#4ade80">✓ Password set</text>
      </g>
      <g transform="translate(30, 296)">
        <rect width="220" height="32" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
        <text x="15" y="21" font-family="'Courier New', monospace" font-size="12" fill="#4ade80">✓ sudo NOPASSWD</text>
      </g>
    </g>

    <!-- ==================== ARROWS ==================== -->
    <!-- Arrow 1: Amazon Linux → seed.iso -->
    <g filter="url(#glow)">
      <line x1="345" y1="315" x2="425" y2="315" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="8,4"/>
      <polygon points="425,310 435,315 425,320" fill="#3b82f6"/>
    </g>

    <!-- Arrow 2: seed.iso → VM -->
    <g filter="url(#glow)">
      <line x1="755" y1="315" x2="845" y2="315" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="8,4"/>
      <polygon points="845,310 855,315 845,320" fill="#22c55e"/>
    </g>

    <!-- ==================== LABELS ==================== -->
    <!-- Cloud-Init label on arrows -->
    <text x="385" y="298" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">NoCloud</text>
    <text x="800" y="298" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">Cloud-Init</text>

    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Running Amazon Linux 2023 Locally</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">QEMU/KVM  •  Cloud-Init  •  Zero Cloud Costs</text>

    <!-- ==================== BOTTOM BAR ==================== -->
    <g transform="translate(0, 530)">
      <!-- Floating dock design with rounded corners -->
      <rect x="60" width="1080" height="75" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" opacity="0.9"/>

      <!-- Centered tech tags inside dock -->
      <g transform="translate(325, 24)">
        <rect x="0" y="0" width="80" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
        <text x="40" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f59e0b">QEMU</text>
      </g>
      <g transform="translate(425, 24)">
        <rect x="0" y="0" width="80" height="28" rx="14" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
        <text x="40" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#3b82f6">KVM</text>
      </g>
      <g transform="translate(525, 24)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
        <text x="55" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22c55e">Cloud-Init</text>
      </g>
      <g transform="translate(655, 24)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
        <text x="60" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#60a5fa">Virt-Manager</text>
      </g>
      <g transform="translate(795, 24)">
        <rect x="0" y="0" width="80" height="28" rx="14" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
        <text x="40" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#a78bfa">DevOps</text>
      </g>
    </g>
  </g>
</svg>
