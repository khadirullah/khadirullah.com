<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Automated VM Provisioning Pipeline</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">Visualizing the deploy.sh script execution flow</text>

    <!-- ==================== PIPELINE STAGES ==================== -->
    <!-- Stage 1 -->
    <g transform="translate(30, 150)">
      <rect width="170" height="190" rx="12" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
      <text x="85" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">1. CLI Arguments</text>
      <circle cx="85" cy="70" r="20" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="85" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#c084fc">Args</text>
      <text x="85" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">vm-name &amp; id</text>
      <text x="85" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#64748b">amzn-vm2 devopslab02</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(240, 150)">
      <rect width="170" height="190" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <text x="85" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">2. Config Setup</text>
      <circle cx="85" cy="70" r="20" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#60a5fa">YAML</text>
      <text x="85" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">Writes meta-data</text>
      <text x="85" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">Copies user-data</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(450, 150)">
      <rect width="170" height="190" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <text x="85" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">3. ISO Build</text>
      <circle cx="85" cy="70" r="20" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#60a5fa">ISO</text>
      <text x="85" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">genisoimage</text>
      <text x="85" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#60a5fa">-> seed.iso</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(660, 150)">
      <rect width="170" height="190" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <text x="85" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">4. Disk Clone</text>
      <circle cx="85" cy="70" r="20" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#60a5fa">Clone</text>
      <text x="85" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">Copy template</text>
      <text x="85" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#60a5fa">-> vm2.qcow2</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(870, 150)">
      <rect width="170" height="190" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="85" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">5. Deploy Headless</text>
      <circle cx="85" cy="70" r="20" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
      <text x="85" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#4ade80">VM</text>
      <text x="85" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">virt-install</text>
      <text x="85" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#4ade80">VM Running</text>
    </g>

    <!-- ==================== CONNECTIONS ==================== -->
    <g stroke="url(#arrowGrad)" stroke-width="2.5" fill="none" filter="url(#glow)">
      <line x1="200" y1="245" x2="240" y2="245"/>
      <line x1="410" y1="245" x2="450" y2="245"/>
      <line x1="620" y1="245" x2="660" y2="245"/>
      <line x1="830" y1="245" x2="870" y2="245"/>
    </g>

    <!-- ==================== TERMINAL BLOCK ==================== -->
    <g transform="translate(150, 375)">
      <rect width="770" height="150" rx="10" fill="#05070c" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Title bar -->
      <rect width="770" height="25" rx="5" fill="#0b0f19"/>
      <circle cx="15" cy="12" r="3" fill="#ef4444"/>
      <circle cx="25" cy="12" r="3" fill="#eab308"/>
      <circle cx="35" cy="12" r="3" fill="#22c55e"/>
      <text x="385" y="17" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Terminal - deploy.sh execution log</text>
      
      <!-- Logs -->
      <g font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" xml:space="preserve">
        <text x="15" y="50"><tspan fill="#a78bfa">$</tspan> ./deploy.sh amzn-devops-vm2 devopslab02</text>
        <text x="15" y="70" fill="#c084fc">=== Provisioning amzn-devops-vm2 ===</text>
        <text x="15" y="88">Generating unique meta-data...</text>
        <text x="15" y="106">Generating seed ISO (volume: cidata)...</text>
        <text x="15" y="124">Copying master disk &amp; starting VM headless...</text>
        <text x="15" y="142" fill="#4ade80">=== amzn-devops-vm2 deployed! Find IP: virsh domifaddr amzn-devops-vm2 ===</text>
      </g>
    </g>
  </g>
</svg>
