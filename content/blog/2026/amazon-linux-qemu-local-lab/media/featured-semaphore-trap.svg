<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">The Cloud-Init Semaphore Trap</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">Why re-attaching the same seed.iso fails to reset or restore the password</text>

    <!-- ==================== LEFT CARD: Semaphore Storage ==================== -->
    <g transform="translate(40, 140)">
      <rect width="450" height="340" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect width="450" height="4" rx="2" fill="url(#accentOrange)" y="0"/>

      <text x="25" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Instance Cache on VM Disk</text>
      <text x="25" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Stored locally inside `/var/lib/cloud/` directory</text>

      <!-- Folder Structure Visualizer -->
      <g transform="translate(25, 80)">
        <rect width="400" height="230" rx="8" fill="#05070c" stroke="#1e293b" stroke-width="1"/>
        <g font-family="'Courier New', monospace" font-size="11.5" fill="#94a3b8" xml:space="preserve">
          <text x="15" y="30" fill="#f59e0b">/var/lib/cloud/</text>
          <text x="15" y="50">├── data/</text>
          <text x="15" y="70">│   └── instance-id <tspan fill="#64748b">("i-devopslab01")</tspan></text>
          <text x="15" y="90">└── instances/</text>
          <text x="15" y="110" fill="#fbbf24">    └── i-devopslab01/</text>
          <text x="15" y="130">        ├── instance-id</text>
          <text x="15" y="150" fill="#f43f5e">        ├── sem/            &lt;-- SEMAPHORE DIR</text>
          <text x="15" y="170" fill="#f43f5e">        │   └── config_set_passwords</text>
          <text x="15" y="190">        └── user-data.txt</text>
        </g>
        <!-- Overlay warning highlight -->
        <rect x="145" y="135" width="230" height="42" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
        <text x="385" y="160" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#ef4444" font-weight="700">PREVENTS SET-PASSWORDS MODULE RUNNING</text>
      </g>
    </g>

    <!-- ==================== RIGHT CARD: Decision Flow ==================== -->
    <g transform="translate(540, 140)">
      <rect width="520" height="340" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect width="520" height="4" rx="2" fill="#ef4444" y="0"/>

      <text x="25" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">The Boot logic &amp; Lock Loop</text>
      <text x="25" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">How Cloud-Init handles identical instance IDs on reboot</text>

      <!-- Flow logic list -->
      <g transform="translate(25, 80)">
        <rect width="470" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Step 1 -->
        <g transform="translate(15, 20)">
          <circle cx="10" cy="15" r="8" fill="#ef4444"/>
          <text x="10" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff">1</text>
          <text x="28" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#f8fafc" font-weight="600">Boot checks Instance-ID: "i-devopslab01"</text>
          <text x="28" y="33" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Matches the cached instance ID on disk -> skipped fresh setup</text>
        </g>

        <!-- Step 2 -->
        <g transform="translate(15, 80)">
          <circle cx="10" cy="15" r="8" fill="#ef4444"/>
          <text x="10" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff">2</text>
          <text x="28" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#f8fafc" font-weight="600">Checks semaphores for config_set_passwords</text>
          <text x="28" y="33" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#f43f5e" font-weight="600">File exists! Skips chpasswd module (once-per-instance)</text>
        </g>

        <!-- Step 3 -->
        <g transform="translate(15, 140)">
          <circle cx="10" cy="15" r="8" fill="#ef4444"/>
          <text x="10" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff">3</text>
          <text x="28" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#f8fafc" font-weight="600">Meanwhile, lock script runs (once-per-instance is skipped? No!)</text>
          <text x="28" y="33" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">The system locks the user password, but chpasswd never unlocks it.</text>
        </g>

        <line x1="15" y1="185" x2="455" y2="185" stroke="#1e293b" stroke-width="1"/>
        <text x="235" y="210" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#3b82f6">💡 Fix: Increment to "i-devopslab02" in meta-data!</text>
      </g>
    </g>

    <!-- Connective arrow showing warning flow -->
    <g filter="url(#glow)">
      <path d="M 490 280 L 540 280" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="530,275 540,280 530,285" fill="#ef4444"/>
    </g>
  </g>
</svg>
