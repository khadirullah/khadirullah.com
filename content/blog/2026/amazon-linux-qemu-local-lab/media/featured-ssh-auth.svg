<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Secure SSH Key Authentication</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">How public/private keys are injected and verified on first boot</text>

    <!-- ==================== LEFT CARD: Workstation (SSH Client) ==================== -->
    <g transform="translate(40, 140)">
      <rect width="280" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect width="280" height="4" rx="2" fill="url(#accentOrange)" y="0"/>

      <text x="140" y="35" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15.5" fill="#f8fafc">1. Local Workstation</text>
      <text x="140" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Key generator client</text>

      <!-- Private Key Box -->
      <g transform="translate(20, 85)">
        <rect width="240" height="90" rx="8" fill="#05070c" stroke="#ef4444" stroke-width="1"/>
        <text x="15" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#f87171">🔒 Private Key (id_ed25519)</text>
        <text x="15" y="50" font-family="'Courier New', monospace" font-size="10" fill="#64748b">-----BEGIN OPENSSH PRIVATE KEY-----</text>
        <text x="15" y="65" font-family="'Courier New', monospace" font-size="10" fill="#64748b">b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAA...</text>
        <text x="15" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#ef4444" font-weight="700">NEVER SHARE - KEEPS SECRET</text>
      </g>

      <!-- Public Key Box -->
      <g transform="translate(20, 195)">
        <rect width="240" height="90" rx="8" fill="#05070c" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#60a5fa">🔓 Public Key (id_ed25519.pub)</text>
        <text x="15" y="50" font-family="'Courier New', monospace" font-size="10" fill="#64748b">ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA...</text>
        <text x="15" y="65" font-family="'Courier New', monospace" font-size="10" fill="#64748b">devops-local</text>
        <text x="15" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#60a5fa" font-weight="700">SHARED WITH CLOUD-INIT</text>
      </g>
    </g>

    <!-- ==================== MIDDLE CARD: Injection Pipeline ==================== -->
    <g transform="translate(380, 180)">
      <rect width="280" height="240" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
      <rect width="280" height="4" rx="2" fill="url(#accentBlue)" y="0"/>

      <text x="140" y="35" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">2. Injection Flow</text>
      <text x="140" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">From Workstation into Guest VM</text>

      <g transform="translate(20, 85)">
        <rect width="240" height="130" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <g font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">
          <text x="15" y="30">1. Paste public key to user-data</text>
          <text x="15" y="60">2. genisoimage creates seed.iso</text>
          <text x="15" y="90">3. Cloud-Init extracts on VM boot</text>
          <text x="15" y="112">4. Writes to guest disk</text>
        </g>
      </g>
    </g>

    <!-- ==================== RIGHT CARD: Guest VM (SSH Server) ==================== -->
    <g transform="translate(720, 140)">
      <rect width="320" height="320" rx="16" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <rect width="320" height="4" rx="2" fill="url(#accentGreen)" y="0"/>

      <text x="160" y="35" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15.5" fill="#f8fafc">3. Amazon Linux VM</text>
      <text x="160" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Verified SSH Server</text>

      <!-- Guest authorized_keys Box -->
      <g transform="translate(20, 85)">
        <rect width="280" height="150" rx="8" fill="#05070c" stroke="#166534" stroke-width="1"/>
        <text x="15" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#4ade80">📄 authorized_keys file</text>
        <text x="15" y="45" font-family="'Courier New', monospace" font-size="9.5" fill="#64748b">Path: /home/ec2-user/.ssh/authorized_keys</text>
        <line x1="15" y1="58" x2="265" y2="58" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="80" font-family="'Courier New', monospace" font-size="10.5" fill="#4ade80">ssh-ed25519 AAAAC3NzaC1lZ...</text>
        <text x="15" y="98" font-family="'Courier New', monospace" font-size="10.5" fill="#4ade80">devops-local</text>
        <text x="15" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Verifies signature on login requests</text>
      </g>

      <text x="160" y="275" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">✓ Passwordless login enabled</text>
    </g>

    <!-- Connective arrow showing warning flow -->
    <g filter="url(#glow)">
      <path d="M 320 280 L 380 280" stroke="url(#arrowGrad)" stroke-width="2"/>
      <polygon points="372,276 380,280 372,284" fill="#3b82f6"/>
    </g>
    <g filter="url(#glow)">
      <path d="M 660 280 L 720 280" stroke="url(#arrowGrad)" stroke-width="2"/>
      <polygon points="712,276 720,280 712,284" fill="#22c55e"/>
    </g>
  </g>
</svg>
