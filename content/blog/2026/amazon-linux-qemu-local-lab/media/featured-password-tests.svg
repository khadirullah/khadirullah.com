<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">8 Controlled Troubleshooting Tests</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">Mapping password behavior across different Cloud-Init and VM states</text>

    <!-- ==================== ROW 1 ==================== -->
    <!-- Test 1 -->
    <g transform="translate(50, 140)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 1: Fresh Boot</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: seed.iso attached</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ Console Pass: WORKS</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- Test 2 -->
    <g transform="translate(320, 140)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 2: Normal Reboot</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: seed.iso attached</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ Console Pass: WORKS</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- Test 3 -->
    <g transform="translate(590, 140)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 3: ISO Removed</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: seed.iso detached</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#f87171">✗ Console Pass: LOCKED</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- Test 4 -->
    <g transform="translate(860, 140)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 4: Re-attach ISO</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: Same instance-id</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#f87171">✗ Console Pass: LOCKED</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- ==================== ROW 2 ==================== -->
    <!-- Test 5 -->
    <g transform="translate(50, 330)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 5: cloud-init.disabled</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: disabled file created</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#f87171">✗ Console Pass: LOCKED</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- Test 6 -->
    <g transform="translate(320, 330)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 6: systemctl disable</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: services disabled</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#f87171">✗ Console Pass: LOCKED</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- Test 7 -->
    <g transform="translate(590, 330)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 7: systemctl mask</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: services masked</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ Console Pass: WORKS</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- Test 8 -->
    <g transform="translate(860, 330)">
      <rect width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Test 8: lock_passwd: false</text>
      <text x="15" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">State: inside user-data</text>
      <line x1="15" y1="65" x2="225" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#f87171">✗ Console Pass: LOCKED</text>
      <text x="15" y="125" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#4ade80">✓ SSH Key Auth: WORKS</text>
    </g>

    <!-- ==================== DOCK LEGEND ==================== -->
    <g transform="translate(50, 520)">
      <rect width="1050" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="525" y="25" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Conclusion: <tspan fill="#4ade80" font-weight="700">Test 7 (Masking services)</tspan> is the only reliable way to completely disable Cloud-Init and prevent default locking on ISO removal.
      </text>
    </g>
  </g>
</svg>
