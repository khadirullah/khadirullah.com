<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Cloud-Init NoCloud Lifecycle</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">How Cloud-Init falls back to local data sources when offline</text>

    <!-- ==================== STEP 1: VM BOOT ==================== -->
    <g transform="translate(60, 160)">
      <rect width="250" height="230" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect width="250" height="4" rx="2" fill="url(#accentOrange)" y="0"/>
      <text x="125" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">1. VM Boot</text>
      
      <!-- Power Icon -->
      <g transform="translate(105, 60)">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <line x1="20" y1="8" x2="20" y2="20" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      
      <text x="125" y="140" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Amazon Linux starts</text>
      <text x="125" y="160" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">systemd triggers</text>
      <text x="125" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-size="11.5" fill="#f59e0b">cloud-init-local.service</text>
    </g>

    <!-- ==================== STEP 2: METADATA QUERY ==================== -->
    <g transform="translate(425, 160)">
      <rect width="270" height="230" rx="16" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <rect width="270" height="4" rx="2" fill="#ef4444" y="0"/>
      <text x="135" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">2. Metadata Query</text>

      <!-- Network Request Icon -->
      <g transform="translate(115, 60)">
        <rect x="0" y="0" width="40" height="30" rx="4" fill="none" stroke="#ef4444" stroke-width="2"/>
        <line x1="20" y1="30" x2="20" y2="40" stroke="#ef4444" stroke-width="2"/>
        <!-- Warning mark -->
        <circle cx="20" cy="15" r="2" fill="#ef4444"/>
        <line x1="20" y1="7" x2="20" y2="12" stroke="#ef4444" stroke-width="2"/>
      </g>

      <text x="135" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#a3a3a3">HTTP GET to AWS endpoint:</text>
      <text x="135" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#ef4444">http://169.254.169.254</text>
      <text x="135" y="185" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#fca5a5" font-weight="600">❌ Connection Refused / Timeout</text>
      <text x="135" y="202" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#7f1d1d">(Not on AWS EC2)</text>
    </g>

    <!-- ==================== STEP 3: NOCLOUD FALLBACK ==================== -->
    <g transform="translate(805, 160)">
      <rect width="270" height="230" rx="16" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <rect width="270" height="4" rx="2" fill="url(#accentGreen)" y="0"/>
      <text x="135" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">3. NoCloud Fallback</text>

      <!-- CD Mounting Icon -->
      <g transform="translate(120, 60)">
        <circle cx="15" cy="15" r="14" fill="none" stroke="#22c55e" stroke-width="2"/>
        <circle cx="15" cy="15" r="4" fill="#22c55e"/>
      </g>

      <text x="135" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Scans CDROM devices for</text>
      <text x="135" y="150" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12.5" fill="#4ade80">Volume Label: "cidata"</text>
      <text x="135" y="185" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#4ade80" font-weight="600">✅ Reads config from seed.iso</text>
      <text x="135" y="202" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#15803d">(DataSourceNoCloud)</text>
    </g>

    <!-- ==================== PROVISIONING RESULTS ==================== -->
    <g transform="translate(250, 425)">
      <rect width="700" height="85" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="30" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Resulting Configuration Action:</text>
      <g transform="translate(30, 48)" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
        <text x="0" y="12">👤 Creates default user: ec2-user</text>
        <text x="230" y="12">🔑 Injects SSH Public Key authentication</text>
        <text x="500" y="12">🏷️ Configures local hostname</text>
      </g>
    </g>

    <!-- ==================== CONNECTING ARROWS ==================== -->
    <!-- Step 1 to 2 -->
    <g filter="url(#glow)">
      <line x1="310" y1="275" x2="415" y2="275" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="415,270 425,275 415,280" fill="#ef4444"/>
    </g>

    <!-- Step 2 to 3 -->
    <g filter="url(#glow)">
      <line x1="695" y1="275" x2="795" y2="275" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="795,270 805,275 795,280" fill="#22c55e"/>
    </g>
  </g>
</svg>
