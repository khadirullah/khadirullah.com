<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Amazon Linux Security Model</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">The lock-first, unlock-on-provisioning execution sequence</text>

    <!-- ==================== STEP 1: LOCK FIRST ==================== -->
    <g transform="translate(50, 160)">
      <rect width="250" height="260" rx="16" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
      <rect width="250" height="4" rx="2" fill="#ef4444" y="0"/>
      
      <text x="125" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">1. Default Lock State</text>

      <!-- Lock Symbol -->
      <g transform="translate(105, 60)">
        <rect x="5" y="15" width="30" height="22" rx="4" fill="none" stroke="#ef4444" stroke-width="2"/>
        <path d="M 12 15 L 12 8 C 12 3, 28 3, 28 8 L 28 15" fill="none" stroke="#ef4444" stroke-width="2"/>
      </g>

      <text x="125" y="145" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">On base system boot,</text>
      <text x="125" y="165" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">EC2 account password is locked:</text>
      <text x="125" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ef4444">passwd -l ec2-user</text>
      <text x="125" y="215" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#7f1d1d">(Prevents brute-force access)</text>
    </g>

    <!-- ==================== STEP 2: CLOUD-INIT INTERCEPT ==================== -->
    <g transform="translate(370, 160)">
      <rect width="270" height="260" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <rect width="270" height="4" rx="2" fill="url(#accentBlue)" y="0"/>

      <text x="135" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">2. Cloud-Init Check</text>

      <!-- Cog icon -->
      <g transform="translate(115, 60)" stroke="#3b82f6" stroke-width="2" fill="none">
        <circle cx="20" cy="20" r="12"/>
        <line x1="20" y1="2" x2="20" y2="8"/>
        <line x1="20" y1="32" x2="20" y2="38"/>
        <line x1="2" y1="20" x2="8" y2="20"/>
        <line x1="32" y1="20" x2="38" y2="20"/>
      </g>

      <text x="135" y="145" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Reads user-data &amp; checks</text>
      <text x="135" y="165" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">if credentials/password config is</text>
      <text x="135" y="185" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">explicitly defined inside:</text>
      <text x="135" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#60a5fa">chpasswd: { list: ... }</text>
    </g>

    <!-- ==================== STEP 3: BRANCHES ==================== -->
    <!-- Path A (Unlocked) -->
    <g transform="translate(710, 160)">
      <rect width="330" height="115" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Path A: Password Unlocked</text>
      <text x="15" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">User-data config matches. Cloud-Init runs:</text>
      <line x1="15" y1="68" x2="315" y2="68" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="94" font-family="'Courier New', monospace" font-size="11" fill="#4ade80">passwd -u ec2-user (Console Open)</text>
    </g>

    <!-- Path B (Remains Locked) -->
    <g transform="translate(710, 305)">
      <rect width="330" height="115" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13.5" fill="#f8fafc">Path B: Remaining Locked</text>
      <text x="15" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Default behavior if no password defined:</text>
      <line x1="15" y1="68" x2="315" y2="68" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="94" font-family="'Courier New', monospace" font-size="11" fill="#fbbf24">Only SSH key authentication works</text>
    </g>

    <!-- ==================== CONNECTING ARROWS ==================== -->
    <!-- Step 1 to 2 -->
    <g filter="url(#glow)">
      <line x1="300" y1="290" x2="365" y2="290" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="6,4"/>
      <polygon points="365,286 373,290 365,294" fill="#3b82f6"/>
    </g>

    <!-- Step 2 to Branch A -->
    <g filter="url(#glow)">
      <path d="M 640 290 Q 660 290 660 220 L 710 220" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <polygon points="702,216 710,220 702,224" fill="#22c55e"/>
    </g>

    <!-- Step 2 to Branch B -->
    <g filter="url(#glow)">
      <path d="M 640 290 Q 660 290 660 360 L 710 360" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <polygon points="702,356 710,360 702,364" fill="#f59e0b"/>
    </g>
  </g>
</svg>
