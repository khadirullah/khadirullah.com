<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">QCOW2 Copy-on-Write Linked Clones</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">Optimizing storage by sharing a base read-only master image</text>

    <!-- ==================== TOP CARD: Backing Master Template ==================== -->
    <g transform="translate(370, 140)">
      <rect width="460" height="130" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
      <rect width="460" height="4" rx="2" fill="url(#accentOrange)" y="0"/>
      <text x="230" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Backing File (Master Template)</text>
      
      <!-- Disk Icon -->
      <g transform="translate(30, 45)">
        <path d="M 0 10 C 0 5, 20 0, 40 0 C 60 0, 80 5, 80 10 L 80 50 C 80 55, 60 60, 40 60 C 20 60, 0 55, 0 50 Z" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <path d="M 0 22 C 0 27, 20 32, 40 32 C 60 32, 80 27, 80 22" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 0 35 C 0 40, 20 45, 40 45 C 60 45, 80 40, 80 35" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      </g>

      <g transform="translate(130, 50)" font-family="'Segoe UI', system-ui, sans-serif">
        <text x="0" y="16" font-family="'Courier New', monospace" font-weight="700" font-size="13" fill="#fbbf24">al2023-master.qcow2</text>
        <text x="0" y="36" font-size="11.5" fill="#94a3b8">Size: ~600 MB (Read-Only template)</text>
        <text x="0" y="52" font-size="11.5" fill="#94a3b8">Shared base operating system code</text>
      </g>
    </g>

    <!-- ==================== BOTTOM ROW: Linked Clone Overlays ==================== -->
    <!-- Overlay VM1 -->
    <g transform="translate(60, 360)">
      <rect width="290" height="130" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <rect width="290" height="4" rx="2" fill="url(#accentBlue)" y="0"/>
      <text x="145" y="30" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Linked Clone 1 (vm1)</text>
      <text x="145" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="11.5" fill="#60a5fa">vm1/amzn-devops-vm1.qcow2</text>
      <line x1="20" y1="65" x2="270" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="145" y="88" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Size: &lt; 50 MB (grows on write)</text>
      <text x="145" y="106" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22c55e" font-weight="600">Reads master | Writes locally</text>
    </g>

    <!-- Overlay VM2 -->
    <g transform="translate(410, 360)">
      <rect width="290" height="130" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <rect width="290" height="4" rx="2" fill="url(#accentBlue)" y="0"/>
      <text x="145" y="30" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Linked Clone 2 (vm2)</text>
      <text x="145" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="11.5" fill="#60a5fa">vm2/amzn-devops-vm2.qcow2</text>
      <line x1="20" y1="65" x2="270" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="145" y="88" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Size: &lt; 50 MB (grows on write)</text>
      <text x="145" y="106" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22c55e" font-weight="600">Reads master | Writes locally</text>
    </g>

    <!-- Overlay VM3 -->
    <g transform="translate(760, 360)">
      <rect width="290" height="130" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
      <rect width="290" height="4" rx="2" fill="url(#accentBlue)" y="0"/>
      <text x="145" y="30" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Linked Clone 3 (vm3)</text>
      <text x="145" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="11.5" fill="#60a5fa">vm3/amzn-devops-vm3.qcow2</text>
      <line x1="20" y1="65" x2="270" y2="65" stroke="#1e293b" stroke-width="1"/>
      <text x="145" y="88" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Size: &lt; 50 MB (grows on write)</text>
      <text x="145" y="106" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22c55e" font-weight="600">Reads master | Writes locally</text>
    </g>

    <!-- ==================== CONNECTING ARROWS ==================== -->
    <!-- VM1 to Master -->
    <g filter="url(#glow)">
      <path d="M 205 360 Q 205 315 370 240" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <polygon points="362,238 370,240 366,248" fill="#f59e0b"/>
    </g>
    <!-- VM2 to Master -->
    <g filter="url(#glow)">
      <path d="M 555 360 L 555 270" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <polygon points="551,278 555,270 559,278" fill="#f59e0b"/>
    </g>
    <!-- VM3 to Master -->
    <g filter="url(#glow)">
      <path d="M 905 360 Q 905 315 790 240" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <polygon points="794,248 790,240 798,238" fill="#f59e0b"/>
    </g>

    <!-- Labels on arrows -->
    <text x="260" y="310" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#64748b" font-weight="700">Backing Link (-b)</text>
    <text x="565" y="310" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#64748b" font-weight="700">Backing Link (-b)</text>
    <text x="860" y="310" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#64748b" font-weight="700">Backing Link (-b)</text>
  </g>
</svg>
