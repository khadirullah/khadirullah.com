<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Local VM Lab Architecture</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">Multi-VM Local Homelab Environment via QEMU/KVM</text>

    <!-- ==================== LEFT CARD: Host Workstation ==================== -->
    <g transform="translate(40, 140)">
      <rect width="270" height="340" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect width="270" height="4" rx="2" fill="url(#accentOrange)" y="0"/>
      
      <!-- Workstation Laptop Icon -->
      <g transform="translate(105, 30)">
        <rect x="10" y="10" width="50" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <line x1="0" y1="42" x2="70" y2="42" stroke="#f59e0b" stroke-width="3"/>
        <line x1="30" y1="42" x2="40" y2="42" stroke="#fbbf24" stroke-width="4"/>
      </g>

      <text x="135" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">DevOps Workstation</text>
      <text x="135" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Ubuntu / Fedora / Mint</text>

      <!-- Terminal / Files block -->
      <g transform="translate(20, 145)">
        <rect width="230" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" font-family="'Courier New', monospace" font-size="10.5" fill="#f59e0b">$ genisoimage -volid cidata \</text>
        <text x="24" y="38" font-family="'Courier New', monospace" font-size="10.5" fill="#f59e0b">-o seed.iso user-data meta-data</text>
        <line x1="10" y1="52" x2="220" y2="52" stroke="#1e293b" stroke-width="1"/>
        <!-- File list -->
        <text x="15" y="72" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">📄 user-data  (SSH keys &amp; pass)</text>
        <text x="15" y="90" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">📄 meta-data  (hostname &amp; id)</text>
      </g>

      <g transform="translate(20, 275)">
        <rect width="230" height="45" rx="8" fill="#1b1c2b" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
        <text x="115" y="26" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#fbbf24">Generates: seed.iso</text>
      </g>
    </g>

    <!-- ==================== MIDDLE CARD: QEMU/KVM Hypervisor ==================== -->
    <g transform="translate(370, 140)">
      <rect width="320" height="340" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="320" height="4" rx="2" fill="url(#accentBlue)" y="0"/>

      <!-- Hypervisor / Server Icon -->
      <g transform="translate(130, 25)">
        <rect width="60" height="45" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
        <line x1="10" y1="15" x2="50" y2="15" stroke="#3b82f6" stroke-width="1.5"/>
        <line x1="10" y1="25" x2="50" y2="25" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="15" cy="35" r="2" fill="#22c55e"/>
        <circle cx="25" cy="35" r="2" fill="#22c55e"/>
      </g>

      <text x="160" y="95" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">QEMU/KVM Hypervisor</text>
      <text x="160" y="115" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">Linux Kernel Virtualization</text>

      <!-- Storage & VM Mapping -->
      <g transform="translate(20, 135)">
        <rect width="280" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="140" y="24" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#60a5fa">Storage &amp; Provisioning Pool</text>
        <line x1="10" y1="36" x2="270" y2="36" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Master Image -->
        <g transform="translate(15, 50)">
          <rect width="250" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
          <text x="15" y="20" font-family="'Courier New', monospace" font-size="10.5" fill="#94a3b8">💾 al2023-master.qcow2 (Template)</text>
        </g>
        <!-- Overlay Linked Clones -->
        <g transform="translate(15, 95)">
          <rect width="250" height="70" rx="4" fill="#0b0f19" stroke="#1e3a8a" stroke-width="1"/>
          <text x="10" y="18" font-family="'Courier New', monospace" font-size="10.5" fill="#60a5fa">└── vm1.qcow2 (Linked Clone)</text>
          <text x="10" y="36" font-family="'Courier New', monospace" font-size="10.5" fill="#60a5fa">└── vm2.qcow2 (Linked Clone)</text>
          <text x="10" y="54" font-family="'Courier New', monospace" font-size="10.5" fill="#60a5fa">└── vm3.qcow2 (Linked Clone)</text>
        </g>
      </g>
    </g>

    <!-- ==================== RIGHT CARDS: Multiple Running VMs ==================== -->
    <!-- VM 1 -->
    <g transform="translate(750, 140)">
      <rect width="250" height="95" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">amzn-devops-vm1</text>
      <text x="15" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#a3a3a3">Status: Running | vCPU: 1</text>
      <text x="15" y="70" font-family="'Courier New', monospace" font-size="11" fill="#4ade80">IP: 192.168.122.101</text>
      <circle cx="220" cy="30" r="6" fill="#22c55e" filter="url(#glow)"/>
    </g>

    <!-- VM 2 -->
    <g transform="translate(750, 260)">
      <rect width="250" height="95" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">amzn-devops-vm2</text>
      <text x="15" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#a3a3a3">Status: Running | vCPU: 1</text>
      <text x="15" y="70" font-family="'Courier New', monospace" font-size="11" fill="#4ade80">IP: 192.168.122.102</text>
      <circle cx="220" cy="30" r="6" fill="#22c55e" filter="url(#glow)"/>
    </g>

    <!-- VM 3 -->
    <g transform="translate(750, 380)">
      <rect width="250" height="95" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">amzn-devops-vm3</text>
      <text x="15" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#a3a3a3">Status: Running | vCPU: 1</text>
      <text x="15" y="70" font-family="'Courier New', monospace" font-size="11" fill="#4ade80">IP: 192.168.122.103</text>
      <circle cx="220" cy="30" r="6" fill="#22c55e" filter="url(#glow)"/>
    </g>

    <!-- ==================== CONNECTING ARROWS ==================== -->
    <!-- Workstation to Hypervisor -->
    <g filter="url(#glow)">
      <path d="M 310 310 L 370 310" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="370,305 380,310 370,315" fill="#3b82f6"/>
    </g>

    <!-- Hypervisor to VMs -->
    <g filter="url(#glow)">
      <path d="M 690 310 L 710 310 L 710 185 L 750 185" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <path d="M 710 310 L 750 310" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <path d="M 710 310 L 710 425 L 750 425" stroke="url(#arrowGrad)" stroke-width="2" fill="none"/>
      <polygon points="742,181 750,185 742,189" fill="#22c55e"/>
      <polygon points="742,306 750,310 742,314" fill="#22c55e"/>
      <polygon points="742,421 750,425 742,429" fill="#22c55e"/>
    </g>
  </g>
</svg>
