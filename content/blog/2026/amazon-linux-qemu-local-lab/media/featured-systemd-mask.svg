<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle background circles -->
  <circle cx="150" cy="500" r="200" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="1050" cy="130" r="250" fill="#1e3a5f" opacity="0.06"/>

  <!-- Content Group with Safe-Zone Margins -->
  <g transform="translate(90, 47) scale(0.85)">
    <!-- ==================== HEADER ==================== -->
    <text x="600" y="65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="0.5">Systemd Generators &amp; Service Masking</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16" fill="#64748b">Why systemctl disable fails on Cloud-Init and how systemctl mask resolves it</text>

    <!-- ==================== LEFT CARD: systemctl disable (FAILING) ==================== -->
    <g transform="translate(40, 140)">
      <rect width="460" height="340" rx="16" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
      <rect width="460" height="4" rx="2" fill="#ef4444" y="0"/>

      <text x="30" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Failing Approach: systemctl disable</text>
      <text x="30" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Static symlinks are removed, but systemd generators bypass them</text>

      <!-- Flow step diagram inside left card -->
      <g transform="translate(25, 80)">
        <rect width="410" height="230" rx="8" fill="#05070c" stroke="#1e293b" stroke-width="1"/>
        <g font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
          <!-- Step 1 -->
          <text x="15" y="30" fill="#f8fafc" font-weight="600">1. Admin runs systemctl disable</text>
          <text x="25" y="48" font-size="10.5">Removes symlink: /etc/systemd/system/.../cloud-init.service</text>
          
          <!-- Step 2 -->
          <text x="15" y="85" fill="#f8fafc" font-weight="600">2. early boot systemd generator triggers</text>
          <text x="25" y="103" font-size="10.5">cloud-init-generator scans kernel config and datasources</text>
          
          <!-- Step 3 -->
          <text x="15" y="140" fill="#f8fafc" font-weight="600">3. Dynamic dependency recreation</text>
          <text x="25" y="158" font-size="10.5">Creates symlinks in /run/systemd/generator/ to force load</text>
          
          <!-- Step 4 -->
          <text x="15" y="195" fill="#f87171" font-weight="700">❌ Result: Cloud-Init still executes, account is locked</text>
        </g>
      </g>
    </g>

    <!-- ==================== RIGHT CARD: systemctl mask (SUCCESS) ==================== -->
    <g transform="translate(560, 140)">
      <rect width="480" height="340" rx="16" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
      <rect width="480" height="4" rx="2" fill="url(#accentGreen)" y="0"/>

      <text x="30" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Success Approach: systemctl mask</text>
      <text x="30" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Symlink directed to /dev/null makes loading impossible</text>

      <!-- Flow step diagram inside right card -->
      <g transform="translate(25, 80)">
        <rect width="430" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <g font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
          <!-- Step 1 -->
          <text x="15" y="30" fill="#f8fafc" font-weight="600">1. Admin runs systemctl mask</text>
          <text x="25" y="48" font-family="'Courier New', monospace" font-size="10.5" fill="#a78bfa">/etc/systemd/.../cloud-init.service -> /dev/null</text>
          
          <!-- Step 2 -->
          <text x="15" y="85" fill="#f8fafc" font-weight="600">2. early boot systemd generator triggers</text>
          <text x="25" y="103" font-size="10.5">cloud-init-generator tries to request / link service</text>
          
          <!-- Step 3 -->
          <text x="15" y="140" fill="#f8fafc" font-weight="600">3. Systemd intercepts empty unit</text>
          <text x="25" y="158" font-size="10.5">Sees unit links to /dev/null, ignores generator activation</text>
          
          <!-- Step 4 -->
          <text x="15" y="195" fill="#4ade80" font-weight="700">✅ Result: Cloud-Init blocked, password remains active</text>
        </g>
      </g>
    </g>
  </g>
</svg>
