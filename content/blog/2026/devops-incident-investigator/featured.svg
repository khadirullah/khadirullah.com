<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1A1F35" />
      <stop offset="100%" stop-color="#090B14" />
    </linearGradient>
    
    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glowCoral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D96FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4D96FF" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Effect -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Glowing Orbs (Abstract Background) -->
  <circle cx="200" cy="150" r="400" fill="url(#glowCoral)" />
  <circle cx="1000" cy="500" r="450" fill="url(#glowBlue)" />
  <circle cx="800" cy="100" r="300" fill="url(#glowCoral)" opacity="0.6" />

  <!-- Abstract Network/Graph Lines representing SQL JOINs / Correlation -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" fill="none">
    <path d="M-50 200 Q 300 150 400 350 T 1300 400" />
    <path d="M-50 500 Q 400 600 600 350 T 1300 150" />
    <path d="M200 -50 Q 300 300 800 350 T 1000 700" />
    
    <!-- Connecting Nodes -->
    <circle cx="400" cy="350" r="6" fill="#FF6B6B" opacity="0.8" />
    <circle cx="600" cy="350" r="6" fill="#4D96FF" opacity="0.8" />
    <circle cx="800" cy="350" r="6" fill="#FF6B6B" opacity="0.8" />
  </g>

  <!-- Main Glassmorphism Content Card -->
  <rect x="150" y="100" width="900" height="430" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" filter="url(#glass)" />
  
  <!-- Content inside Card -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Hackathon Badge -->
    <rect x="340" y="160" width="520" height="46" rx="23" fill="#FF6B6B" fill-opacity="0.15" stroke="#FF6B6B" stroke-width="1.5" />
    <text x="600" y="189" font-size="18" font-weight="600" fill="#FF8E8E" text-anchor="middle" letter-spacing="1">
      PIRATES OF THE CORAL-BEAN  •  BY WEMAKEDEVS
    </text>

    <!-- Main Title -->
    <text x="600" y="279" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
      DevOps Incident
    </text>
    <!-- Highlighted "Investigator" -->
    <text x="600" y="349" font-size="64" font-weight="800" fill="#FF6B6B" text-anchor="middle" letter-spacing="-1">
      Investigator
    </text>

    <!-- Subtitle -->
    <text x="600" y="419" font-size="24" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.7">
      GitHub ↔ Sentry ↔ Slack ↔ Custom APIs
    </text>

    <!-- Built By / Powered By -->
    <text x="200" y="485" font-size="18" font-weight="500" fill="#A0ABBA" opacity="0.9">Built by Khadirullah</text>
    <text x="1000" y="485" font-size="18" font-weight="500" fill="#A0ABBA" text-anchor="end" opacity="0.9">Powered by Coral SQL</text>

    <!-- UI/CLI Decorative dots (Mac style) -->
    <circle cx="190" cy="135" r="6" fill="#FF5F56" />
    <circle cx="210" cy="135" r="6" fill="#FFBD2E" />
    <circle cx="230" cy="135" r="6" fill="#27C93F" />
  </g>

  <!-- Magnifying Glass Icon (Investigator Theme) -->
  <g transform="translate(100, 480) scale(0.6)" opacity="0.3">
    <circle cx="50" cy="50" r="30" stroke="#4D96FF" stroke-width="8" fill="none" />
    <line x1="72" y1="72" x2="100" y2="100" stroke="#4D96FF" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Database/SQL Icon -->
  <g transform="translate(1000, 60) scale(0.6)" opacity="0.3">
    <ellipse cx="50" cy="30" rx="40" ry="15" stroke="#FF6B6B" stroke-width="6" fill="none" />
    <ellipse cx="50" cy="60" rx="40" ry="15" stroke="#FF6B6B" stroke-width="6" fill="none" />
    <ellipse cx="50" cy="90" rx="40" ry="15" stroke="#FF6B6B" stroke-width="6" fill="none" />
    <line x1="10" y1="30" x2="10" y2="90" stroke="#FF6B6B" stroke-width="6" />
    <line x1="90" y1="30" x2="90" y2="90" stroke="#FF6B6B" stroke-width="6" />
  </g>
</svg>
